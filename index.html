<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fairground Organ String Data Piano Roll</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101216;color:#eee;font:14px Arial,sans-serif}
#app{height:100vh;display:flex;flex-direction:column}header{padding:9px;background:#1b1e24;border-bottom:1px solid #3a3e47;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;background:#282d36;color:#eee;border:1px solid #4a505c;border-radius:5px;padding:7px}
button{cursor:pointer}button.primary{background:#315f95}button.danger{background:#743333}
#status{margin-left:auto;color:#aeb4c0;font-size:12px}
#main{flex:1;min-height:0;display:flex}
#left{width:215px;min-width:215px;overflow:auto;background:#1b1e24;border-right:1px solid #3a3e47}
h3{font-size:12px;color:#aeb4c0;margin:12px}.tool{padding:8px 12px;border-bottom:1px solid #292d35;cursor:pointer}.tool.active{background:#2a4058}
#rollWrap{flex:1;overflow:auto;background:#0d0f13}
#roll{position:relative;background:repeating-linear-gradient(to bottom,#0d0f13 0,#0d0f13 19px,#282c34 20px);min-width:27000px}
.event{position:absolute;height:16px;border-radius:3px;border:1px solid #ddd8;z-index:5;cursor:pointer;min-width:4px}
.event.note{background:#4d8cff}.event.register{background:#c7833e;height:12px}.event.division{background:#65a565;height:10px}.event.percussion{background:#9361bd}
.event:hover{filter:brightness(1.2)}.label{position:absolute;left:0;width:48px;height:20px;background:#181b21;color:#858c99;font-size:10px;padding:4px;z-index:4;border-right:1px solid #333}
#bottom{display:flex;gap:8px;align-items:center;padding:8px;background:#1b1e24;border-top:1px solid #3a3e47}.small{font-size:11px;color:#aeb4c0}
#stringOut{flex:1;min-width:250px;white-space:nowrap;overflow:hidden;background:#11141a;border:1px solid #414752;border-radius:4px;padding:7px;font:11px monospace}
</style>
</head>
<body>
<div id="app">
<header>
<button id="newBtn">New</button><button id="playBtn" class="primary">Play</button>
<button id="cancelBtn" class="danger">Cancel / All Off</button><button id="clearBtn">Clear</button>
<label>Snap <select id="snap"><option value="125">1/8</option><option value="250" selected>1/4</option><option value="500">1/2</option><option value="1000">1 bar</option></select></label>
<label>Tool <select id="tool"><option value="place">Place</option><option value="erase">Erase</option></select></label>
<span id="status">Select a register or division, then click the roll.</span>
</header>
<div id="main">
<aside id="left"><h3>REGISTERS</h3><div id="regs"></div><h3>DIVISIONS</h3><div id="divs"></div><h3>PERCUSSION</h3><div id="percs"></div>
<h3>NOTE PLACEMENT</h3><div class="tool" id="noteTool">MIDI Note</div>
</aside>
<section id="rollWrap"><div id="roll"></div></section>
</div>
<div id="bottom"><span class="small">String Data</span><div id="stringOut">0,1</div><button id="copy">Copy</button><button id="download">Download .txt</button></div>
</div>
<script>
(()=> {
const REG=[[2,'Cello'],[3,'Flute'],[4,'Glockenspiel'],[5,'Bourdon'],[6,'Violin'],[7,'Forte'],[15,'Flageolet']];
const DIV=[[16,'Bass'],[17,'Accompaniment'],[18,'Melody']];
const PERC=[[9,'Snare Right'],[10,'Wood Block Right'],[11,'Snare Left'],[12,'Wood Block Left'],[13,'Cymbal'],[14,'Bass Drum']];
const events=[];let selected={type:'register',code:6,name:'Violin'},playing=false,raf=0,start=0;
const roll=document.querySelector('#roll'),wrap=document.querySelector('#rollWrap'),status=document.querySelector('#status'),out=document.querySelector('#stringOut');
const ROW=20,MIN=31,MAX=96,PX=.45,TOTAL=60000;
roll.style.width=(TOTAL*PX)+'px';roll.style.height=((MAX-MIN+1)*ROW)+'px';

function choices(list,parent,type){list.forEach(([code,name])=>{let d=document.createElement('div');d.className='tool';d.textContent=code+': '+name;d.onclick=()=>{selected={type,code,name};document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));d.classList.add('active');status.textContent='Selected '+name;};parent.appendChild(d)})}
choices(REG,document.querySelector('#regs'),'register');choices(DIV,document.querySelector('#divs'),'division');choices(PERC,document.querySelector('#percs'),'percussion');
document.querySelector('#noteTool').onclick=()=>{selected={type:'note',code:0,name:'MIDI Note'};document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));document.querySelector('#noteTool').classList.add('active');status.textContent='Selected MIDI Note; click a pitch row.'};
document.querySelector('#regs .tool').classList.add('active');

function timeX(t){return t*PX}function xTime(x){let s=+document.querySelector('#snap').value;return Math.max(0,Math.round((x/PX)/s)*s)}
function noteY(n){return(MAX-n)*ROW}function yNote(y){return Math.max(MIN,Math.min(MAX,MAX-Math.floor(y/ROW)))}

function render(){
roll.querySelectorAll('.event,.label,.gridline').forEach(x=>x.remove());
for(let n=MAX;n>=MIN;n--){let l=document.createElement('div');l.className='label';l.textContent=n;l.style.top=noteY(n)+'px';roll.appendChild(l)}
for(let t=0;t<=TOTAL;t+=1000){let l=document.createElement('div');l.className='gridline';l.style.position='absolute';l.style.top=0;l.style.bottom=0;l.style.left=timeX(t)+'px';l.style.width=(t%4000===0?'2px':'1px');l.style.background=t%4000===0?'#555d69':'#353a44';l.style.pointerEvents='none';roll.appendChild(l)}
events.forEach((e,i)=>{let d=document.createElement('div');d.className='event '+e.type;d.style.left=timeX(e.time)+'px';d.style.top=(e.type==='note'?noteY(e.note)+2:e.type==='register'?3:e.type==='division'?21:38)+'px';d.style.width=Math.max(4,timeX(e.duration||180))+'px';d.title=e.name||((e.type==='note'?'MIDI '+e.note:e.code)+' @ '+e.time+'ms');d.onclick=ev=>{ev.stopPropagation();if(document.querySelector('#tool').value==='erase'){events.splice(i,1);render();encode()}};d.oncontextmenu=ev=>{ev.preventDefault();events.splice(i,1);render();encode()};roll.appendChild(d)})
}
function add(clientX,clientY){
if(document.querySelector('#tool').value==='erase')return;
let r=roll.getBoundingClientRect(),t=xTime(clientX-r.left),y=clientY-r.top;
if(selected.type==='note'){let n=yNote(y);if(events.some(e=>e.type==='note'&&e.note===n&&e.time===t)){status.textContent='That note already exists at that time.';return}events.push({type:'note',note:n,time:t,duration:+document.querySelector('#snap').value,name:'MIDI '+n})}
else {if(events.some(e=>e.type===selected.type&&e.code===selected.code&&e.time===t)){status.textContent='That event already exists there.';return}events.push({type:selected.type,code:selected.code,time:t,duration:selected.type==='register'?300:180,name:selected.name})}
events.sort((a,b)=>a.time-b.time);render();encode();status.textContent='Placed '+(selected.name)+' at '+t+' ms'
}
roll.onclick=e=>add(e.clientX,e.clientY);

function encode(){
if(!events.length){out.textContent='0,1';return '0,1'}
let a=[...events].sort((x,y)=>x.time-y.time),last=0,groups=[];
a.forEach(e=>{let vals=e.type==='note'?[18,e.note]:[e.code];groups.push([Math.max(0,Math.round(e.time-last)),...vals]);last=e.time});
groups.push([250,1]);let s=groups.map(x=>x.join(',')).join('|');out.textContent=s;return s
}
function stop(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0}
function play(){if(!events.length){status.textContent='Nothing to play.';return}playing=true;start=performance.now();status.textContent='Playing…';let end=Math.max(...events.map(e=>e.time+e.duration));function f(){if(!playing)return;let t=performance.now()-start;if(t>=end){stop();status.textContent='Playback finished.';return}wrap.scrollLeft=Math.max(0,timeX(t)-180);raf=requestAnimationFrame(f)}raf=requestAnimationFrame(f)}

document.querySelector('#playBtn').onclick=()=>playing?stop():play();
document.querySelector('#clearBtn').onclick=()=>{events.length=0;stop();render();encode();status.textContent='Roll cleared.'};
document.querySelector('#newBtn').onclick=()=>{events.length=0;stop();render();encode();status.textContent='New roll.'};
document.querySelector('#cancelBtn').onclick=()=>{let end=events.length?Math.max(...events.map(e=>e.time+e.duration)):0;events.push({type:'register',code:1,time:end,duration:120,name:'ALL OFF / RESET'});stop();render();encode();status.textContent='Cancel / All Off inserted.'};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(encode());status.textContent='String Data copied.'}catch{status.textContent='Copy unavailable; select the String Data manually.'}};
document.querySelector('#download').onclick=()=>{let b=new Blob([encode()],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fairground-organ-string-data.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();encode();
})();
</script>
</body></html>
